  <style>
    :root {
      --bg-dark: #0a0e17;
      --bg-mid: #161e31;
      --gold-light: #f9d4b6;
      --gold-dark: #c89574;
      --glass-bg: rgba(20, 25, 38, 0.55);
      --glass-border: rgba(249, 212, 182, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: fixed;
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, var(--bg-dark), var(--bg-mid));
      color: #fff;
    }

    body::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle at 50% 50%, rgba(200, 149, 116, 0.08) 0%, transparent 50%);
      animation: rotateGlow 20s linear infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes rotateGlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    h1, h2 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      text-align: center;
    }

    .gold-text {
      background: linear-gradient(to right, var(--gold-light), var(--gold-dark), var(--gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200% auto;
      animation: shine 4s linear infinite;
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    /* ---------- INTRO SCREEN ---------- */

      inset: 0;
      display: flex;
      flex-direction: column;

      z-index: 50;
      background: var(--bg-dark);
      transition: opacity 1.5s ease, visibility 1.5s ease;
    }

    .intro-title {
      font-size: clamp(28px, 6vw, 54px);
      margin-bottom: 40px;
      letter-spacing: 2px;
      padding: 0 20px;
    }

      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;

    }

      border: 1px solid rgba(249, 212, 182, 0.4);

    }

To fix this, you need to use a semi-transparent background (like `rgba`) on the timer box so the photo shows through, and use CSS Flexbox or Grid to split the screen into a 1:2 ratio.

Here is how to structure the HTML and CSS to achieve both:

### The HTML Structure

<div class="screen-container">
  <!-- Left side (1 part) -->
  <div class="left-panel">
    <h2>Menu / Controls</h2>
  </div>

  <!-- Right side (2 parts) -->
  <div class="right-panel">
    <!-- The Photo -->

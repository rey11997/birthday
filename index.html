
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Almost Her Day ✨</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap');

    :root {
      --pink: #ff7eb6;
      --rose: #ff4f93;
      --soft: #ffd8e8;
      --white: #fff;
      --text: #fff8fc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: "DM Sans", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 126, 182, .18), transparent 28%),
        radial-gradient(circle at 80% 30%, rgba(148, 114, 255, .14), transparent 28%),
        radial-gradient(circle at 50% 90%, rgba(255, 79, 147, .16), transparent 35%),
        linear-gradient(145deg, #120818 0%, #250b22 45%, #110818 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, transparent, black 25%, black 75%, transparent);
      pointer-events: none;
    }

    .stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: white;
      border-radius: 50%;
      opacity: .6;
      animation: twinkle 2.5s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: .2; transform: scale(.7); }
      50% { opacity: 1; transform: scale(1.4); }
    }

    .container {
      width: min(92vw, 900px);
      text-align: center;
      z-index: 2;
      position: relative;
      padding: 40px 20px;
    }

    .eyebrow {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 5px;
      color: #ffc8df;
      margin-bottom: 18px;
      opacity: .9;
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(52px, 9vw, 95px);
      line-height: .95;
      font-weight: 600;
      letter-spacing: -2px;
      text-shadow:
        0 0 30px rgba(255, 126, 182, .25),
        0 0 70px rgba(255, 126, 182, .12);
    }

    .subtitle {
      margin: 22px auto 36px;
      max-width: 590px;
      color: #f5d9e6;
      font-size: 17px;
      line-height: 1.7;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      max-width: 680px;
      margin: 0 auto;
    }

    .time-box {
      position: relative;
      padding: 25px 12px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.055);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 22px;
      box-shadow:
        inset 0 1px rgba(255,255,255,.08),
        0 15px 50px rgba(0,0,0,.22);
    }

    .number {
      display: block;
      font-size: clamp(34px, 6vw, 58px);
      font-weight: 600;
      letter-spacing: -2px;
      color: white;
    }

    .label {
      display: block;
      margin-top: 8px;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #eebbd2;
    }

    .date-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 34px;
      padding: 11px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: #ffd7e8;
      font-size: 13px;
    }

    .hint {
      margin-top: 26px;
      color: rgba(255,255,255,.5);
      font-size: 12px;
    }

    /* Floating clickable items */
    .float-item {
      position: absolute;
      border: 0;
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(10px);
      width: 54px;
      height: 54px;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
      transition: transform .25s ease, background .25s ease;
      animation: float 5s ease-in-out infinite;
      box-shadow: 0 8px 30px rgba(0,0,0,.18);
    }

    .float-item:hover {
      transform: scale(1.15) rotate(8deg);
      background: rgba(255,126,182,.18);
    }

    .float-item:active {
      transform: scale(.92);
    }

    .one { left: 7%; top: 18%; animation-delay: 0s; }
    .two { right: 9%; top: 25%; animation-delay: 1s; }
    .three { left: 12%; bottom: 18%; animation-delay: 2s; }
    .four { right: 11%; bottom: 16%; animation-delay: 1.5s; }
    .five { left: 4%; top: 52%; animation-delay: .6s; }
    .six { right: 4%; top: 58%; animation-delay: 2.3s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-14px) rotate(4deg); }
    }

    .burst {
      position: fixed;
      pointer-events: none;
      font-size: 24px;
      animation: burst 1s ease forwards;
      z-index: 20;
    }

    @keyframes burst {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(.7);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -150px) scale(1.4);
      }
    }

    .message {
      position: fixed;
      left: 50%;
      bottom: 35px;
      transform: translateX(-50%);
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(20, 8, 24, .7);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(12px);
      color: #ffe3ef;
      font-size: 13px;
      opacity: 0;
      transition: opacity .3s ease;
      pointer-events: none;
      z-index: 10;
    }

    .message.show {
      opacity: 1;
    }

    @media (max-width: 650px) {
      .countdown {
        grid-template-columns: repeat(2, 1fr);
      }

      .float-item {
        width: 44px;
        height: 44px;
        font-size: 18px;
      }

      .one { left: 3%; top: 12%; }
      .two { right: 3%; top: 18%; }
      .three { left: 3%; bottom: 10%; }
      .four { right: 3%; bottom: 10%; }
      .five, .six {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="stars" id="stars"></div>

  <button class="float-item one" onclick="magic(event, '💗')">💗</button>
  <button class="float-item two" onclick="magic(event, '✨')">✨</button>
  <button class="float-item three" onclick="magic(event, '🌸')">🌸</button>
  <button class="float-item four" onclick="magic(event, '🎀')">🎀</button>
  <button class="float-item five" onclick="magic(event, '💕')">💕</button>
  <button class="float-item six" onclick="magic(event, '🦋')">🦋</button>

  <main class="container">
    <div class="eyebrow">something beautiful is coming</div>

    <h1>Her Day<br>is Almost Here</h1>

    <p class="subtitle">
      Some dates are just dates.<br>
      And then there is <strong>27 August</strong>.
    </p>

    <section class="countdown">
      <div class="time-box">
        <span class="number" id="days">00</span>
        <span class="label">Days</span>
      </div>

      <div class="time-box">
        <span class="number" id="hours">00</span>
        <span class="label">Hours</span>
      </div>

      <div class="time-box">
        <span class="number" id="minutes">00</span>
        <span class="label">Minutes</span>
      </div>

      <div class="time-box">
        <span class="number" id="seconds">00</span>
        <span class="label">Seconds</span>
      </div>
    </section>

    <div class="date-pill">🎂 27 August 2026</div>

    <div class="hint">Tap the floating little surprises ✨</div>
  </main>

  <div class="message" id="message"></div>

  <script>
    // Create background stars
    const stars = document.getElementById("stars");

    for (let i = 0; i < 80; i++) {
      const star = document.createElement("span");
      star.className = "star";

      star.style.left = Math.random() * 100 + "%";
      star.style.top = Math.random() * 100 + "%";
      star.style.animationDelay = Math.random() * 3 + "s";
      star.style.opacity = (Math.random() * .7 + .2).toFixed(2);

      stars.appendChild(star);
    }

    // Countdown to the start of 27 August 2026
    const target = new Date("2026-08-27T00:00:00");

    function updateCountdown() {
      const now = new Date();
      const difference = target - now;

      if (difference <= 0) {
        document.getElementById("days").textContent = "00";
        document.getElementById("hours").textContent = "00";
        document.getElementById("minutes").textContent = "00";
        document.getElementById("seconds").textContent = "00";

        document.querySelector("h1").innerHTML = "It's Her<br>Day ✨";
        document.querySelector(".subtitle").innerHTML =
          "27 August is finally here.<br>Make it as beautiful as she is. 💗";

        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor(
        (difference / (1000 * 60 * 60)) % 24
      );
      const minutes = Math.floor(
        (difference / (1000 * 60)) % 60
      );
      const seconds = Math.floor(
        (difference / 1000) % 60
      );

      document.getElementById("days").textContent = String(days).padStart(2, "0");
      document.getElementById("hours").textContent = String(hours).padStart(2, "0");
      document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
      document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    // Floating interaction
    const messages = [
      "A little sparkle for her ✨",
      "Someone is going to be very happy 💗",
      "27 August feels special already 🌸",
      "Save this little moment 🎀",
      "Almost time for the celebration 🦋",
      "A tiny birthday wish, early 💕"
    ];

    function magic(event, emoji) {
      const count = 6;

      for (let i = 0; i < count; i++) {
        const burst = document.createElement("div");
        burst.className = "burst";
        burst.textContent = emoji;

        burst.style.left = event.clientX + (Math.random() * 80 - 40) + "px";
        burst.style.top = event.clientY + (Math.random() * 50 - 25) + "px";
        burst.style.animationDelay = (i * 0.05) + "s";

        document.body.appendChild(burst);

        setTimeout(() => burst.remove(), 1100);
      }

      const message = document.getElementById("message");
      message.textContent = messages[Math.floor(Math.random() * messages.length)];
      message.classList.add("show");

      clearTimeout(window.messageTimer);
      window.messageTimer = setTimeout(() => {
        message.classList.remove("show");
      }, 2200);
    }
  </script>

</body>
</html>
```

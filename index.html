<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You ✨</title>

  <!-- Elegant Fonts: Cormorant Garamond for headings, Montserrat for numbers and text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0a0e17;
      --bg-mid: #161e31;
      --gold-light: #f9d4b6;
      --gold-dark: #c89574;
      --glass-bg: rgba(20, 25, 38, 0.5);
      --glass-border: rgba(249, 212, 182, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, var(--bg-dark), var(--bg-mid));
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Animated ambient background glow */
    body::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle at 50% 50%, rgba(200, 149, 116, 0.08) 0%, transparent 50%);
      animation: rotateGlow 20s linear infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes rotateGlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ---------- TEXT & TYPOGRAPHY ---------- */
    h1, h2 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      text-align: center;
    }

    .gold-text {
      background: linear-gradient(to right, var(--gold-light), var(--gold-dark), var(--gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200% auto;
      animation: shine 4s linear infinite;
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    /* ---------- INTRO SCREEN (THE GATE) ---------- */
    #intro-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      background: var(--bg-dark);
      transition: opacity 1.5s ease, visibility 1.5s ease;
    }

    .intro-title {
      font-size: clamp(32px, 6vw, 54px);
      margin-bottom: 40px;
      letter-spacing: 2px;
    }

    .unlock-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: transparent;
      border: 2px solid var(--gold-dark);
      color: var(--gold-light);
      font-size: 24px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      transition: all 0.4s ease;
      box-shadow: 0 0 20px rgba(200, 149, 116, 0.2), inset 0 0 20px rgba(200, 149, 116, 0.1);
    }

    .unlock-btn::before {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1px solid rgba(249, 212, 182, 0.4);
      animation: pulseRing 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    .unlock-btn:hover {
      background: rgba(200, 149, 116, 0.15);
      transform: scale(1.05);
    }

    .unlock-text {
      margin-top: 25px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: rgba(255,255,255,0.6);
    }

    @keyframes pulseRing {
      0% { transform: scale(0.8); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    /* ---------- MAIN CONTENT (COUNTDOWN) ---------- */
    #main-screen {
      position: relative;
      z-index: 10;
      opacity: 0;
      visibility: hidden;
      transform: translateY(30px);
      transition: all 1.5s cubic-bezier(0.2, 0.8, 0.2, 1);
      transition-delay: 0.3s;
      width: min(90vw, 700px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #main-screen.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 50px 30px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
    }

    .card-subtitle {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 5px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 15px;
    }

    .card-title {
      font-size: clamp(40px, 8vw, 65px);
      margin-bottom: 40px;
      line-height: 1.1;
    }

    .countdown-wrapper {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .time-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .time-num {
      font-size: clamp(32px, 6vw, 48px);
      font-weight: 300;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }

    .time-label {
      margin-top: 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--gold-dark);
    }

    .date-badge {
      display: inline-block;
      margin-top: 40px;
      padding: 10px 24px;
      border: 1px solid var(--glass-border);
      border-radius: 100px;
      font-size: 14px;
      letter-spacing: 1px;
      background: rgba(0,0,0,0.2);
    }

    /* ---------- POLAROID PHOTO GALLERY ---------- */
    #photo-layer {
      position: absolute;
      inset: 0;
      z-index: 2; /* Behind the glass card (z-index 10) */
      pointer-events: none;
    }

    .polaroid {
      position: absolute;
      width: clamp(140px, 22vw, 220px);
      background: #fff;
      padding: 10px 10px 35px 10px; /* Thicker bottom for polaroid look */
      border-radius: 4px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      opacity: 0;
      transform: translateY(50px) rotate(0deg);
      animation: polaroidFloat 7s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    }

    .polaroid-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-size: cover;
      background-position: center;
      background-color: #eee;
      border-radius: 2px;
    }

    @keyframes polaroidFloat {
      0% { 
        opacity: 0; 
        transform: translateY(50px) scale(0.9) rotate(calc(var(--rot) - 5deg)); 
        filter: blur(5px);
      }
      20% { 
        opacity: 0.6; /* Soft opacity so it doesn't distract too much */
        filter: blur(0px);
      }
      80% {
        opacity: 0.6;
      }
      100% { 
        opacity: 0; 
        transform: translateY(-80px) scale(1.05) rotate(var(--rot)); 
        filter: blur(8px);
      }
    }

    /* Mobile Tweaks */
    @media (max-width: 600px) {
      .glass-card { padding: 40px 20px; }
      .countdown-wrapper { gap: 8px; }
      .polaroid { padding: 6px 6px 24px 6px; }
    }
  </style>
</head>
<body>

  <!-- Photo Layer (Background) -->
  <div id="photo-layer"></div>

  <!-- Intro Screen / Unlock Gate -->
  <div id="intro-screen">
    <h1 class="intro-title gold-text">A Moment in Time</h1>
    <button class="unlock-btn" id="unlockBtn">✦</button>
    <p class="unlock-text">Tap to Unlock</p>
  </div>

  <!-- Main Countdown Screen -->
  <div id="main-screen">
    <div class="glass-card">
      <div class="card-subtitle">Counting down to</div>
      <h2 class="card-title gold-text">Her Special Day</h2>
      
      <div class="countdown-wrapper">
        <div class="time-box">
          <span class="time-num" id="days">00</span>
          <span class="time-label">Days</span>
        </div>
        <div class="time-box">
          <span class="time-num" id="hours">00</span>
          <span class="time-label">Hours</span>
        </div>
        <div class="time-box">
          <span class="time-num" id="minutes">00</span>
          <span class="time-label">Minutes</span>
        </div>
        <div class="time-box">
          <span class="time-num" id="seconds">00</span>
          <span class="time-label">Seconds</span>
        </div>
      </div>
      
      <div class="date-badge">August 27, 2026</div>
    </div>
  </div>

  <script>
    // --- 1. CONFIGURATION ---
    // Make sure these filenames exactly match the files in your folder!
    const photos = [
      "pic1.jpeg",
      "pic2.jpeg",
      "pic3.jpeg",
      "pic4.jpeg",
      "pic5.jpeg",
      "pic6.jpeg" 
      // Keep adding "pic7.jpeg", etc., separated by commas if you have more
    ];

    const targetDate = new Date("2026-08-27T00:00:00");

    // --- 2. UNLOCK LOGIC ---
    const introScreen = document.getElementById("intro-screen");
    const mainScreen = document.getElementById("main-screen");
    const unlockBtn = document.getElementById("unlockBtn");

    let isUnlocked = false;

    unlockBtn.addEventListener("click", () => {
      if(isUnlocked) return;
      isUnlocked = true;
      
      // Fade out intro
      introScreen.style.opacity = "0";
      introScreen.style.pointerEvents = "none";
      
      // Reveal main screen and start photos
      setTimeout(() => {
        introScreen.style.visibility = "hidden";
        mainScreen.classList.add("active");
        startPhotoGallery();
      }, 800);
    });

    // --- 3. COUNTDOWN LOGIC ---
    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.getElementById("days").textContent = "00";
        document.getElementById("hours").textContent = "00";
        document.getElementById("minutes").textContent = "00";
        document.getElementById("seconds").textContent = "00";
        document.querySelector(".card-title").textContent = "Happy Birthday ✨";
        document.querySelector(".card-subtitle").textContent = "The day is here";
        return;
      }

      const days = Math.floor(diff / 86400000);
      const hours = Math.floor((diff / 3600000) % 24);
      const minutes = Math.floor((diff / 60000) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("days").textContent = String(days).padStart(2, "0");
      document.getElementById("hours").textContent = String(hours).padStart(2, "0");
      document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
      document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
    }

    // Run immediately, then every second
    updateCountdown();
    setInterval(updateCountdown, 1000);

    // --- 4. POLAROID PHOTO GALLERY LOGIC ---
    const photoLayer = document.getElementById("photo-layer");
    let photoIndex = 0;

    function spawnPhoto() {
      if(photos.length === 0) return;

      // Loop back to start if we run out of photos
      if(photoIndex >= photos.length) {
        photoIndex = 0;
      }

      // Create polaroid container
      const polaroid = document.createElement("div");
      polaroid.className = "polaroid";
      
      // Create inner image div
      const imgDiv = document.createElement("div");
      imgDiv.className = "polaroid-img";
      // Reference local file directly
      imgDiv.style.backgroundImage = `url('${photos[photoIndex]}')`;
      
      polaroid.appendChild(imgDiv);

      // Randomize positioning (keeping them mostly towards the sides so center is clear)
      const isLeftSide = Math.random() > 0.5;
      const leftPos = isLeftSide 
        ? Math.random() * 20 + 5   // 5% to 25% from left
        : Math.random() * 20 + 75; // 75% to 95% from left
      
      const topPos = Math.random() * 40 + 20; // 20% to 60% from top
      const rotation = (Math.random() * 30 - 15).toFixed(1); // -15deg to 15deg

      polaroid.style.left = `${leftPos}%`;
      polaroid.style.top = `${topPos}%`;
      polaroid.style.setProperty('--rot', `${rotation}deg`);

      photoLayer.appendChild(polaroid);

      // Cleanup DOM element after animation completes (7 seconds)
      setTimeout(() => {
        if(polaroid.parentNode) {
          polaroid.remove();
        }
      }, 7000);

      photoIndex++;
    }

    function startPhotoGallery() {
      // Spawn first photo quickly
      setTimeout(spawnPhoto, 500);
      
      // Spawn a new photo every 3.5 seconds (max 2 on screen at a time based on 7s lifespan)
      setInterval(spawnPhoto, 3500);
    }
  </script>
</body>
</html>

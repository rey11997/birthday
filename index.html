```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timer</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, Arial, sans-serif;
      background: #0b1020;
      color: #ffffff;
    }

    .timer-card {
      width: min(90%, 520px);
      padding: 40px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin-bottom: 30px;
      font-size: 28px;
      font-weight: 600;
    }

    .display {
      margin-bottom: 30px;
      font-size: clamp(56px, 14vw, 100px);
      font-weight: 700;
      letter-spacing: 4px;
      font-variant-numeric: tabular-nums;
    }

    .inputs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    input {
      width: 90px;
      padding: 14px 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      text-align: center;
      font-size: 18px;
      outline: none;
    }

    input:focus {
      border-color: #4da3ff;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 13px 22px;
      margin: 4px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: #1677ff;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.9;
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.1);
    }

    .status {
      margin-top: 18px;
      color: #9ca8bd;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="timer-card">
    <h1>Countdown Timer</h1>

    <div class="display" id="display">00:00:00</div>

    <div class="inputs">
      <input id="hours" type="number" min="0" max="99" value="0" placeholder="HH" />
      <input id="minutes" type="number" min="0" max="59" value="5" placeholder="MM" />
      <input id="seconds" type="number" min="0" max="59" value="0" placeholder="SS" />
    </div>

    <div>
      <button id="startBtn">Start</button>
      <button id="pauseBtn" class="secondary">Pause</button>
      <button id="resetBtn" class="secondary">Reset</button>
    </div>

    <div class="status" id="status">Ready</div>
  </main>

  <script>
    let totalSeconds = 0;
    let remainingSeconds = 0;
    let timer = null;
    let running = false;

    const hoursInput = document.getElementById("hours");
    const minutesInput = document.getElementById("minutes");
    const secondsInput = document.getElementById("seconds");

    const display = document.getElementById("display");
    const status = document.getElementById("status");

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function updateDisplay() {
      const hours = Math.floor(remainingSeconds / 3600);
      const minutes = Math.floor((remainingSeconds % 3600) / 60);
      const seconds = remainingSeconds % 60;

      display.textContent =
        `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
    }

    function getInputSeconds() {
      const hours = Math.max(0, Number(hoursInput.value) || 0);
      const minutes = Math.max(0, Number(minutesInput.value) || 0);
      const seconds = Math.max(0, Number(secondsInput.value) || 0);

      return hours * 3600 + minutes * 60 + seconds;
    }

    function startTimer() {
      if (running) return;

      if (remainingSeconds <= 0) {
        totalSeconds = getInputSeconds();
        remainingSeconds = totalSeconds;
      }

      if (remainingSeconds <= 0) {
        status.textContent = "Set a timer first";
        return;
      }

      running = true;
      status.textContent = "Running";

      timer = setInterval(() => {
        remainingSeconds--;
        updateDisplay();

        if (remainingSeconds <= 0) {
          clearInterval(timer);
          timer = null;
          running = false;
          status.textContent = "Time's up!";
          alert("Time's up!");
        }
      }, 1000);
    }

    function pauseTimer() {
      if (!running) return;

      clearInterval(timer);
      timer = null;
      running = false;
      status.textContent = "Paused";
    }

    function resetTimer() {
      clearInterval(timer);
      timer = null;
      running = false;

      remainingSeconds = getInputSeconds();
      updateDisplay();
      status.textContent = "Ready";
    }

    document.getElementById("startBtn").addEventListener("click", startTimer);
    document.getElementById("pauseBtn").addEventListener("click", pauseTimer);
    document.getElementById("resetBtn").addEventListener("click", resetTimer);

    [hoursInput, minutesInput, secondsInput].forEach(input => {
      input.addEventListener("input", () => {
        if (!running) {
          remainingSeconds = getInputSeconds();
          updateDisplay();
          status.textContent = "Ready";
        }
      });
    });

    updateDisplay();
  </script>
</body>
</html>

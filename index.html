<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>For You ✨</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0a0e17;
      --bg-mid: #161e31;
      --gold-light: #f9d4b6;
      --gold-dark: #c89574;
      --glass-bg: rgba(20, 25, 38, 0.65);
      --glass-border: rgba(249, 212, 182, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: fixed;
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, var(--bg-dark), var(--bg-mid));
      color: #fff;
    }

    body::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle at 50% 50%, rgba(200, 149, 116, 0.08) 0%, transparent 50%);
      animation: rotateGlow 20s linear infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes rotateGlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    h1, h2 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      text-align: center;
    }

    .gold-text {
      background: linear-gradient(to right, var(--gold-light), var(--gold-dark), var(--gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200% auto;
      animation: shine 4s linear infinite;
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    /* ---------- INTRO SCREEN ---------- */
    #intro-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      background: var(--bg-dark);
      transition: opacity 1.5s ease, visibility 1.5s ease;
    }

    .intro-title {
      font-size: clamp(28px, 6vw, 54px);
      margin-bottom: 40px;
      letter-spacing: 2px;
      padding: 0 20px;
    }

    .unlock-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: transparent;
      border: 2px solid var(--gold-dark);
      color: var(--gold-light);
      font-size: 24px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      transition: all 0.4s ease;
      box-shadow: 0 0 20px rgba(200, 149, 116, 0.2);
      -webkit-tap-highlight-color: transparent; 
    }

    .unlock-btn::before {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1px solid rgba(249, 212, 182, 0.4);
      animation: pulseRing 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    .unlock-btn:active {
      transform: scale(0.95);
      background: rgba(200, 149, 116, 0.2);
    }

    .unlock-text {
      margin-top: 25px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: rgba(255,255,255,0.6);
    }

    @keyframes pulseRing {
      0% { transform: scale(0.8); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    /* ---------- 1:2 SPLIT MAIN SCREEN ---------- */
    #main-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.5s ease, visibility 1.5s ease;
      z-index: 5;
    }

    #main-screen.active {
      opacity: 1;
      visibility: visible;
    }

    /* TOP PANEL: 1 Part (Timer) */
    .timer-panel {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      z-index: 10;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px 30px;
      width: min(92vw, 600px);
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    }

    .card-subtitle {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 5px;
    }

    .card-title {
      font-size: clamp(24px, 5vw, 42px);
      margin-bottom: 15px;
      line-height: 1.1;
    }

    .countdown-wrapper {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .time-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .time-num {
      font-size: clamp(22px, 5vw, 36px);
      font-weight: 300;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }

    .time-label {
      margin-top: 4px;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gold-dark);
    }

    /* BOTTOM PANEL: 2 Parts (Photo Canvas) */
    .photo-panel {
      flex: 2;
      position: relative;
      overflow: hidden;
      z-index: 2;
    }

    /* ---------- POLAROIDS ---------- */
    .polaroid {
      position: absolute;
      width: 140px;
      background: #fff;
      padding: 8px 8px 24px 8px;
      border-radius: 4px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.6);
      opacity: 0;
      transform: translateY(100%) rotate(0deg);
      animation: polaroidRise 8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      will-change: transform, opacity;
    }

    .polaroid-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-size: cover;
      background-position: center;
      background-color: #eee;
      border-radius: 2px;
    }

    @keyframes polaroidRise {
      0% { 
        opacity: 0; 
        transform: translateY(120%) scale(0.8) rotate(calc(var(--rot) - 5deg)); 
      }
      15% { 
        opacity: 1; 
      }
      80% {
        opacity: 1;
      }
      100% { 
        opacity: 0; 
        transform: translateY(-50%) scale(1.05) rotate(var(--rot)); 
      }
    }

    @media (min-width: 601px) {
      .polaroid {
        width: 180px;
        padding: 10px 10px 30px 10px;
      }
    }
  </style>
</head>
<body>

  <!-- Intro Screen -->
  <div id="intro-screen">
    <h1 class="intro-title gold-text">A Moment in Time</h1>
    <button class="unlock-btn" id="unlockBtn">✦</button>
    <p class="unlock-text">Tap to Unlock</p>
  </div>

  <!-- 1:2 Split Main Screen -->
  <div id="main-screen">
    
    <!-- Top Part (1 Ratio) - Timer Box -->
    <div class="timer-panel">
      <div class="glass-card">
        <div class="card-subtitle">Counting down to</div>
        <h2 class="card-title gold-text">Her Special Day</h2>
        
        <div class="countdown-wrapper">
          <div class="time-box">
            <span class="time-num" id="days">00</span>
            <span class="time-label">Days</span>
          </div>
          <div class="time-box">
            <span class="time-num" id="hours">00</span>
            <span class="time-label">Hours</span>
          </div>
          <div class="time-box">
            <span class="time-num" id="minutes">00</span>
            <span class="time-label">Mins</span>
          </div>
          <div class="time-box">
            <span class="time-num" id="seconds">00</span>
            <span class="time-label">Secs</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Part (2 Ratio) - Photo Floating Canvas -->
    <div class="photo-panel" id="photoPanel"></div>

  </div>

  <script>
    const photos = [
      "pic1.jpeg",
      "pic2.jpeg",
      "pic3.jpeg",
      "pic4.jpeg",
      "pic5.jpeg",
      "pic6.jpeg" 
    ];

    const targetDate = new Date("2026-08-27T00:00:00");

    const introScreen = document.getElementById("intro-screen");
    const mainScreen = document.getElementById("main-screen");
    const unlockBtn = document.getElementById("unlockBtn");
    const photoPanel = document.getElementById("photoPanel");

    let isUnlocked = false;

    unlockBtn.addEventListener("click", () => {
      if(isUnlocked) return;
      isUnlocked = true;
      
      introScreen.style.opacity = "0";
      introScreen.style.pointerEvents = "none";
      
      setTimeout(() => {
        introScreen.style.visibility = "hidden";
        mainScreen.classList.add("active");
        startPhotoGallery();
      }, 800);
    });

    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.getElementById("days").textContent = "00";
        document.getElementById("hours").textContent = "00";
        document.getElementById("minutes").textContent = "00";
        document.getElementById("seconds").textContent = "00";
        document.querySelector(".card-title").textContent = "Happy Birthday ✨";
        document.querySelector(".card-subtitle").textContent = "The day is here";
        return;
      }

      const days = Math.floor(diff / 86400000);
      const hours = Math.floor((diff / 3600000) % 24);
      const minutes = Math.floor((diff / 60000) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("days").textContent = String(days).padStart(2, "0");
      document.getElementById("hours").textContent = String(hours).padStart(2, "0");
      document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
      document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    let photoIndex = 0;

    function spawnPhoto() {
      if(photos.length === 0) return;
      if(photoIndex >= photos.length) photoIndex = 0;

      const polaroid = document.createElement("div");
      polaroid.className = "polaroid";
      
      const imgDiv = document.createElement("div");
      imgDiv.className = "polaroid-img";
      imgDiv.style.backgroundImage = `url('${photos[photoIndex]}')`;
      polaroid.appendChild(imgDiv);

      // Random position strictly inside the 2-ratio photo panel width
      const leftPos = Math.random() * 60 + 10; // 10% to 70%
      const rotation = (Math.random() * 30 - 15).toFixed(1); // -15deg to 15deg

      polaroid.style.left = `${leftPos}%`;
      polaroid.style.bottom = "0px";
      polaroid.style.setProperty('--rot', `${rotation}deg`);

      photoPanel.appendChild(polaroid);

      // Clean up DOM after animation completes (8s)
      setTimeout(() => {
        if(polaroid.parentNode) polaroid.remove();
      }, 8000);

      photoIndex++;
    }

    function startPhotoGallery() {
      setTimeout(spawnPhoto, 300);
      setInterval(spawnPhoto, 3500);
    }
  </script>
</body>
</html>
